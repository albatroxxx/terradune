<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terradune</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: 'Cantarell'; font-style: normal; font-weight: 400;
    font-display: swap; src: url('/assets/fonts/cantarell-400.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Cantarell'; font-style: normal; font-weight: 700;
    font-display: swap; src: url('/assets/fonts/cantarell-700.woff2') format('woff2');
  }
  :root {
    --bg: #f5f7f9; --surface: #ffffff; --sunken: #eef1f4;
    --line: #dde2e8; --line-soft: #e8ecf1;
    --text: #1b2027; --muted: #667080; --faint: #929cab;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

    --create-bg: #e4f7ec;  --create-bd: #35a06b;  --create-fg: #12673e;
    --existing-bg: #e7f1fd; --existing-bd: #4a8fd4; --existing-fg: #17548f;
    --update-bg: #fdf3e0;  --update-bd: #d09826;  --update-fg: #825b06;
    --replace-bg: #fdeee0; --replace-bd: #d47f2e; --replace-fg: #8c4f16;
    --destroy-bg: #fdeceb; --destroy-bd: #d4534e; --destroy-fg: #9d2a25;
  }
  * { box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0;
             overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid #17548f; outline-offset: 2px;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13.5px/1.5 'Cantarell', ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 14px; flex: none;
           padding: 10px 20px; background: var(--surface);
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  #dot.live { background: var(--create-bd); }
  #dot.busy { background: var(--update-bd); animation: pulse 1s infinite alternate; }
  #dot.down { background: var(--destroy-bd); }
  @keyframes pulse { to { opacity: .25; } }
  .tabs { display: flex; gap: 4px; margin-left: 6px; }
  .tabs button { background: none; border: 1px solid transparent; color: var(--muted);
                 font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 6px;
                 cursor: pointer; }
  .tabs button:hover { background: var(--sunken); }
  .tabs button.on { background: var(--sunken); color: var(--text); border-color: var(--line); }
  #meta { color: var(--muted); font-size: 12px; margin-left: auto; font-family: var(--mono); }

  #toolbar { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap;
             padding: 8px 20px; background: var(--surface);
             border-bottom: 1px solid var(--line); }
  #q { font: inherit; font-size: 12.5px; padding: 4px 9px; width: 260px;
       border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
       color: var(--text); }
  #q:focus { outline: 2px solid #b9d4f2; outline-offset: -1px; }
  .chip { font: inherit; font-size: 11.5px; padding: 3px 9px; border-radius: 99px;
          border: 1px solid var(--line); background: var(--bg); color: var(--muted);
          cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chip b { font-weight: 700; }
  .chip.zero { color: var(--muted); }
  #chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button, .chip, #q, #clear, #legend-btn { min-height: 36px; }
  .chip.on.create   { background: var(--create-bg);   border-color: var(--create-bd);   color: var(--create-fg); }
  .chip.on.existing { background: var(--existing-bg); border-color: var(--existing-bd); color: var(--existing-fg); }
  .chip.on.update   { background: var(--update-bg);   border-color: var(--update-bd);   color: var(--update-fg); }
  .chip.on.replace  { background: var(--replace-bg);  border-color: var(--replace-bd);  color: var(--replace-fg); }
  .chip.on.destroy  { background: var(--destroy-bg);  border-color: var(--destroy-bd);  color: var(--destroy-fg); }
  #toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }
  #toolbar .txt { color: var(--muted); font-size: 11.5px; margin-left: auto;
                  font-family: var(--mono); }
  #clear { font: inherit; font-size: 11.5px; padding: 3px 9px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--muted);
           cursor: pointer; }
  #clear[hidden] { display: none; }

  #map { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 40px; position: relative; }
  /* The ribbons sit above the panels: the panels are opaque, so an SVG
     underneath them is invisible. Sized from the scrollable content rather
     than pinned with inset, which would clip everything below the fold. */
  #ribbons { position: absolute; top: 0; left: 0; z-index: 3;
             pointer-events: none; overflow: visible; }
  #mapbody { position: relative; z-index: 1; }

  .ws { margin-bottom: 26px; }
  .ws-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .ws-head h2 { margin: 0; font-size: 14px; font-weight: 700; font-family: var(--mono); }
  .ws-head .sub { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .ws-head .spin { color: var(--update-fg); font-size: 12px; }
  .ws-err { background: var(--destroy-bg); border: 1px solid var(--destroy-bd);
            color: var(--destroy-fg); border-radius: 8px; padding: 9px 12px;
            font: 11.5px/1.5 var(--mono); white-space: pre-wrap; margin-bottom: 10px;
            max-height: 160px; overflow: auto; }

  .vpc-panel { border: 1px solid var(--line); border-radius: 10px;
               background: var(--surface); margin-bottom: 12px; overflow: hidden; }
  .vpc-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
              border-bottom: 1px solid var(--line-soft); background: var(--sunken); }
  .vpc-head .title { font-weight: 700; }
  .vpc-head .sub { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .cols { display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); }
  .lb-panel .cols { grid-template-columns: repeat(5, minmax(165px, 1fr)); }
  .lb-panel .vpc-head { background: var(--lb-head, transparent); }
  .col { padding: 12px 14px 16px; border-right: 1px solid var(--line-soft); min-width: 0; }
  .col:last-child { border-right: none; }
  .col > h3, .others h3 { margin: 0 0 10px; font-size: 10.5px; color: var(--muted);
              text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .col > h3 span, .others h3 span { color: var(--faint); font-weight: 400; }
  .az { margin-bottom: 12px; }
  .az > h4 { margin: 0 0 6px; font-size: 11px; color: var(--muted); font-weight: 400;
             font-family: var(--mono); }

  .card { position: relative; border: 1px solid var(--line); border-left-width: 4px;
          border-radius: 6px; margin-bottom: 7px;
          background: var(--surface); cursor: pointer;
          transition: opacity .12s, box-shadow .12s; }
  .card-main { display: block; width: 100%; min-height: 58px; text-align: left;
               border: 0; background: transparent; color: inherit; font: inherit;
               padding: 7px 34px 7px 32px; cursor: pointer; border-radius: 3px; }
  .card-detail { position: absolute; top: 2px; right: 2px; width: 30px; height: 30px;
                 border: 0; border-radius: 4px; background: transparent;
                 color: inherit; font-size: 19px; cursor: pointer; }
  .card-detail:hover { background: rgba(255,255,255,.65); }
  .card .ico { position: absolute; top: 9px; left: 8px; width: 17px; height: 17px;
               opacity: .92; }
  .card:last-child { margin-bottom: 0; }
  .card .n { font-weight: 700; overflow-wrap: anywhere; font-size: 12.5px; }
  .card .d { color: var(--muted); font-size: 11px; font-family: var(--mono);
             overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 2px 6px; }
  .card .d .st { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .card.create   { background: var(--create-bg);   border-color: var(--create-bd);   color: var(--create-fg); }
  .card.existing { background: var(--existing-bg); border-color: var(--existing-bd); color: var(--existing-fg); }
  .card.update   { background: var(--update-bg);   border-color: var(--update-bd);   color: var(--update-fg); }
  .card.replace  { background: var(--replace-bg);  border-color: var(--replace-bd);  color: var(--replace-fg); }
  .card.destroy  { background: var(--destroy-bg);  border-color: var(--destroy-bd);  color: var(--destroy-fg); }
  .card.destroy .n { text-decoration: line-through; }
  .card .d { color: inherit; }
  .card:focus-within { opacity: 1; }
  .card.hi { box-shadow: 0 0 0 2px rgba(30,40,60,.22); }
  .card.pinned { box-shadow: 0 0 0 2px #3d6ea8; }
  .card.pinned.dim { opacity: 1; }
  .card.dim { background: var(--bg); border-color: var(--line); }
  .card.dim > .card-main > .ico { opacity: .55; }
  #pinned { font-size: 11.5px; color: #3d6ea8; font-weight: 700;
            background: #eaf1fa; border: 1px solid #bcd3ec; border-radius: 99px;
            padding: 2px 10px; }
  #pinned[hidden] { display: none; }
  .contents { margin: 0 8px 8px 10px; padding-left: 8px; border-left: 1px dashed currentColor; }
  .contents .card { margin-bottom: 5px; }
  .contents .card .n { font-size: 11.5px; }

  .empty { color: var(--faint); font-size: 12px; font-style: italic; }
  .others { border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
            padding: 12px 14px; margin-bottom: 12px; }
  .others .grid { display: grid; gap: 7px;
                  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
  /* Categories flow across the width rather than stacking, so a group of one
     does not leave the rest of the row empty. Each keeps its own column and
     grows only as tall as it needs. */
  .cats { display: grid; gap: 12px 16px; align-items: start;
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .cat { min-width: 0; }
  .cat > h4 { display: flex; align-items: center; gap: 7px; margin: 0 0 7px;
              font-size: 11.5px; font-weight: 700; color: var(--text); }
  .cat > h4 svg { width: 15px; height: 15px; flex: none; }
  .cat > h4 em { font-style: normal; color: var(--faint); font-weight: 400;
                 font-size: 11px; }
  .col .cat { margin-bottom: 12px; }
  .col .cat:last-child { margin-bottom: 0; }
  .hint { color: var(--faint); font-size: 11px; margin: 6px 2px 0; }

  #graph { flex: 1; min-height: 0; display: none; cursor: grab; background: var(--bg); }
  #graph.panning { cursor: grabbing; }
  .node-box { fill: var(--surface); stroke-width: 2; }
  .node-type { font: 700 12px var(--mono); }
  .node-name { font: 11px var(--mono); fill: var(--muted); }
  .module-box { fill: none; stroke: var(--faint); stroke-dasharray: 6 4; stroke-width: 1; }
  .module-label { font: 700 11px var(--mono); fill: var(--muted); }
  .edge { fill: none; stroke: #a9b3c0; stroke-width: 1.3; }

  #drawer { position: fixed; top: 0; right: 0; bottom: 0; left: auto;
            width: 480px; max-width: 100%; height: 100%; max-height: 100%; margin: 0; padding: 0;
            color: var(--text); border: 0;
            background: var(--surface); border-left: 1px solid var(--line);
            box-shadow: -6px 0 24px rgba(20,30,50,.10); z-index: 20;
            display: none; flex-direction: column; }
  #drawer.open { display: flex; }
  #drawer::backdrop { background: rgba(27,32,39,.2); }
  .dr-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px;
             border-bottom: 1px solid var(--line); }
  .dr-head .ico { width: 26px; height: 26px; flex: none; margin-top: 1px; }
  .dr-head h2 { margin: 0; font-size: 14.5px; font-weight: 700; overflow-wrap: anywhere; }
  .dr-head .addr { color: var(--muted); font-family: var(--mono); font-size: 11px;
                   overflow-wrap: anywhere; }
  .dr-head button { margin-left: auto; background: none; border: none; cursor: pointer;
                    font-size: 24px; line-height: 1; color: var(--muted);
                    width: 40px; height: 40px; flex: none; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px;
          border-radius: 99px; border: 1px solid; text-transform: uppercase;
          letter-spacing: .05em; }
  .pill.create   { background: var(--create-bg);   border-color: var(--create-bd);   color: var(--create-fg); }
  .pill.existing { background: var(--existing-bg); border-color: var(--existing-bd); color: var(--existing-fg); }
  .pill.update   { background: var(--update-bg);   border-color: var(--update-bd);   color: var(--update-fg); }
  .pill.replace  { background: var(--replace-bg);  border-color: var(--replace-bd);  color: var(--replace-fg); }
  .pill.destroy  { background: var(--destroy-bg);  border-color: var(--destroy-bd);  color: var(--destroy-fg); }
  .dr-body { overflow: auto; padding: 12px 16px 30px; }
  .dr-body h3 { margin: 16px 0 8px; font-size: 10.5px; color: var(--muted);
                text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .dr-body h3:first-child { margin-top: 4px; }
  .attrs { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
  .attrs td { padding: 3px 6px; border-bottom: 1px solid var(--line-soft);
              vertical-align: top; overflow-wrap: anywhere; }
  .attrs td.k { color: var(--muted); font-family: var(--mono); font-size: 11px;
                width: 42%; }
  .attrs td.v { font-family: var(--mono); font-size: 11px; }
  .attrs pre { margin: 0; white-space: pre-wrap; font-size: 10.5px; }
  .unk { color: var(--faint); font-style: italic; }
  .was { color: var(--destroy-fg); text-decoration: line-through; opacity: .8; }
  .now { color: var(--create-fg); }
  .rel { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px;
         overflow: hidden; }
  .rel > summary { list-style: none; cursor: pointer; padding: 6px 9px;
                   display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .rel > summary::-webkit-details-marker { display: none; }
  .rel > summary .ico { width: 15px; height: 15px; flex: none; }
  .rel > summary .sum { color: var(--muted); font-family: var(--mono); font-size: 11px;
                        overflow-wrap: anywhere; }
  .rel[open] > summary { border-bottom: 1px solid var(--line-soft); background: var(--sunken); }
  .rel .inner { padding: 6px 9px; }
  .none { color: var(--faint); font-size: 12px; font-style: italic; }

  #legend { position: fixed; right: 16px; bottom: 16px; z-index: 5;
            display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #legend .items { background: var(--surface); border: 1px solid var(--line);
                   border-radius: 8px; padding: 9px 12px; font-size: 11px;
                   box-shadow: 0 2px 10px rgba(20,30,50,.07); }
  #legend.closed .items { display: none; }
  #legend .items > div { display: flex; align-items: center; gap: 8px; padding: 1.5px 0; }
  #legend i { width: 22px; height: 12px; border-radius: 3px; flex: none;
              border: 1px solid; border-left-width: 4px; }
  #legend-btn { font: inherit; font-size: 11px; cursor: pointer; color: var(--muted);
                background: var(--surface); border: 1px solid var(--line);
                border-radius: 999px; padding: 4px 11px;
                box-shadow: 0 2px 10px rgba(20,30,50,.07); }
  #legend-btn:hover { color: var(--text); border-color: var(--muted); }
  @media (max-width: 960px) {
    header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    #meta { width: 100%; margin-left: 0; overflow-wrap: anywhere; }
    #toolbar { padding: 8px 12px; }
    #q { width: 100%; }
    #toolbar .sep { display: none; }
    #toolbar .txt { margin-left: 0; }
    #map { padding: 12px 12px 64px; }
    .ws-head, .vpc-head { flex-wrap: wrap; }
    .ws-head .sub, .vpc-head .sub { overflow-wrap: anywhere; min-width: 0; }
    .cols, .lb-panel .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .col { border-bottom: 1px solid var(--line-soft); }
    .cats, .others .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 540px) {
    .tabs { margin-left: auto; }
    .tabs button { padding-inline: 8px; }
    .cols, .lb-panel .cols { grid-template-columns: minmax(0, 1fr); }
    .col { border-right: 0; }
    .card-main { min-height: 64px; padding-right: 44px; }
    .card-detail { width: 40px; height: 40px; }
    .chip, #clear, #q, .tabs button { min-height: 40px; }
    .chip { padding-inline: 7px; gap: 4px; }
    #q { font-size: 16px; }
    #pinned { max-width: 100%; overflow-wrap: anywhere; }
  }
  @media (prefers-reduced-motion: reduce) {
    #dot.busy { animation: none; }
    .card { transition: none; }
  }
</style>
<link rel="stylesheet" href="/assets/review.css">
</head>
<body>
<header>
  <div class="brand"><img src="/assets/logo.svg" alt="" width="34" height="34"><h1>Terradune</h1></div>
  <div id="dot" aria-hidden="true"></div>
  <div class="tabs" role="tablist" aria-label="Views">
    <button id="tab-map" type="button" class="on" role="tab" aria-selected="true" aria-controls="map">Resource Map</button>
    <button id="tab-review" type="button" role="tab" aria-selected="false" aria-controls="review" tabindex="-1">Plan</button>
    <button id="tab-graph" type="button" role="tab" aria-selected="false" aria-controls="graph" tabindex="-1">Graph</button>
  </div>
  <span id="meta" role="status"></span>
</header>
<div id="toolbar">
  <label class="sr-only" for="q">Search resources</label>
  <input id="q" type="search" placeholder="Search resources…" autocomplete="off">
  <select id="workspace-filter" aria-label="Workspace"><option value="">All workspaces</option></select>
  <label class="check-control"><input id="changes-only" type="checkbox">Changes only</label>
  <span class="sep"></span>
  <span id="chips"></span>
  <button id="clear" type="button" hidden>Clear filters</button>
  <span class="txt" id="shown"></span>
</div>
<div id="view-tools">
  <strong id="view-name">Resource Map</strong>
  <span id="pinned" role="status" hidden></span>
  <button id="release-pin" class="icon-button" type="button" aria-label="Release pinned path" title="Release pinned path" hidden>&times;</button>
  <div id="view-actions">
    <div id="legend" class="closed">
      <button id="legend-btn" type="button" aria-expanded="false" aria-controls="legend-items">Legend</button>
      <div class="items" id="legend-items">
        <h3>Resource actions</h3>
        <div><i class="legend-action create">+</i><span>Create</span></div>
        <div><i class="legend-action update">~</i><span>Update</span></div>
        <div><i class="legend-action replace">&#8644;</i><span>Replace</span></div>
        <div><i class="legend-action destroy">&#8722;</i><span>Destroy</span></div>
        <div><i class="legend-action existing">=</i><span>Unchanged</span></div>
        <h3>Connections</h3>
        <div><i class="legend-line direct"></i><span>Direct association</span></div>
        <div><i class="legend-line indirect"></i><span>Indirect association</span></div>
        <div><i class="legend-selected"></i><span>Pinned resource</span></div>
      </div>
    </div>
    <button id="expand-view" class="icon-button" type="button" aria-pressed="false" aria-label="Expand view" title="Expand view">&#9974;</button>
  </div>
</div>
<section id="review" role="tabpanel" aria-labelledby="tab-review">
  <aside class="service-rail" aria-label="Resource types"><h2>Resource types</h2><nav id="service-nav" aria-label="Filter by resource type"></nav></aside>
  <main class="review-main">
    <div class="review-heading"><div><h2>Plan review</h2><p id="review-count"></p></div>
      <label><span>Sort by</span><select id="review-sort" aria-label="Sort resources"><option value="action">Action priority</option><option value="address">Resource address</option></select></label></div>
    <div id="review-errors"></div>
    <table id="review-table" class="resource-table" aria-label="Terraform resources">
      <thead><tr><th scope="col">Resource</th><th scope="col">Resource type</th><th scope="col">Action</th><th scope="col">Workspace</th><th scope="col"><span class="sr-only">Relationships</span></th></tr></thead>
      <tbody id="review-body"></tbody>
    </table>
    <div id="review-empty" hidden><h3 id="review-empty-title">Waiting for a plan</h3></div>
  </main>
</section>
<div id="map" role="tabpanel" aria-labelledby="tab-map"><svg id="ribbons" aria-hidden="true"></svg><div id="mapbody"></div></div>
<div id="graph-controls">
  <span id="graph-context">Dependencies</span><button id="graph-all" type="button" hidden>All relationships</button>
  <button id="graph-out" class="icon-button" type="button" aria-label="Zoom out" title="Zoom out">&#8722;</button>
  <button id="graph-in" class="icon-button" type="button" aria-label="Zoom in" title="Zoom in">+</button>
  <button id="graph-fit" class="icon-button" type="button" aria-label="Fit graph" title="Fit graph">&#9974;</button>
</div>
<svg id="graph" role="tabpanel" aria-labelledby="tab-graph" tabindex="0"></svg>
<dialog id="drawer" aria-labelledby="dr-title">
  <div class="dr-head">
    <span class="ico" id="dr-ico"></span>
    <div style="min-width:0">
      <h2 id="dr-title"></h2>
      <div class="addr" id="dr-addr"></div>
      <div style="margin-top:5px"><span class="pill" id="dr-pill"></span></div>
    </div>
    <button id="dr-close" type="button" aria-label="Close details" title="Close details" autofocus>&times;</button>
  </div>
  <div class="dr-body" id="dr-body"></div>
</dialog>

<script src="/assets/elk.bundled.js"></script>
<script src="/assets/review.js"></script>
<script>
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const GRAPH_COLORS = { existing: '#4a8fd4', create: '#35a06b', update: '#d09826',
                       replace: '#d47f2e', destroy: '#d4534e' };
const LABELS = {

function iconSVG(type) {

const label = t => LABELS[t] || t.replace(/^aws_/, '').replace(/_/g, ' ');

// moduleKey pulls the for_each key a module instance was created with:
// module.route_table["web-az1"] -> "web-az1".
function moduleKey(mod) {
  const found = (mod || '').match(/\["([^"]+)"\]/g);
  return found ? found[found.length - 1].slice(2, -2) : '';
}

// In modular code the resource name repeats across every copy — a dozen
// route tables are all "rt[0]" — and the module's own key is what actually
// names them, so it takes precedence over the resource name.
function displayName(n) {
  return n.meta?.name || moduleKey(n.module) || n.name + idx(n.id);
}

// shortRef is the address without its module path: the part that says which
// resource this is once the module key is already the title.
const shortRef = n => n.name + idx(n.id);
const esc = t => String(t).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const idx = a => (a.match(/\[[^\]]+\]$/) || [''])[0];

// Resources whose whole purpose is to bind two others together. The pair is
// [from, to] in the direction the diagram should read.
// What registers targets with a load balancer's target group. Anything else
// that merely mentions a group — an alarm on its metrics, say — is not behind
// it and does not belong in its targets.
const TARGET_PROVIDERS = new Set(['aws_autoscaling_group', 'aws_ecs_service',
  'aws_instance', 'aws_lambda_function', 'aws_network_interface']);

const CONNECTORS = {
  aws_volume_attachment: ['aws_instance', 'aws_ebs_volume'],
  aws_network_interface_attachment: ['aws_instance', 'aws_network_interface'],
  aws_lb_target_group_attachment: ['aws_lb_target_group', 'aws_instance'],
  aws_eip_association: ['aws_instance', 'aws_eip'],
  aws_network_interface_sg_attachment: ['aws_network_interface', 'aws_security_group'],
};

// The order categories are listed in: what a reader looks for first.
const CATEGORY_ORDER = ['aws_instance', 'aws_network_interface', 'aws_ebs_volume',
  'aws_eip', 'aws_lb', 'aws_lb_target_group', 'aws_lb_listener',
  'aws_security_group', 'aws_network_acl', 'aws_db_instance',
  'aws_autoscaling_group', 'aws_launch_template'];

// Which resource types can satisfy each way a route names its next hop.
const ROUTE_TARGET_TYPES = {
  nat_gateway_id: ['aws_nat_gateway'],
  gateway_id: ['aws_internet_gateway', 'aws_vpn_gateway'],
  transit_gateway_id: ['aws_ec2_transit_gateway', 'aws_ec2_transit_gateway_vpc_attachment',
                       'aws_transit_gateway_vpc_attachment'],
  vpc_endpoint_id: ['aws_vpc_endpoint'],
  vpc_peering_connection_id: ['aws_vpc_peering_connection'],
  egress_only_gateway_id: ['aws_egress_only_internet_gateway'],
};

// ---------- model -------------------------------------------------------
function buildMap(ws) {
  const nodes = new Map((ws.nodes || []).map(n => [n.id, n]));
  const deps = new Map();
  for (const e of ws.edges || []) {
    if (!deps.has(e.from)) deps.set(e.from, []);
    deps.get(e.from).push(e.to);
  }
  const depsOfType = (id, pred) =>
    (deps.get(id) || []).filter(d => nodes.has(d) && pred(nodes.get(d)));
  // The same edges read backwards: a load balancer does not mention its
  // listeners, the listeners mention it.
  const dependents = new Map();
  for (const e of ws.edges || []) {
    if (!dependents.has(e.to)) dependents.set(e.to, []);
    dependents.get(e.to).push(e.from);
  }
  const usedByType = (id, pred) =>
    (dependents.get(id) || []).filter(d => nodes.has(d) && pred(nodes.get(d)));

  // Links are directed, and point the way traffic and containment read across
  // the columns: the VPC holds its subnets, a subnet is associated with a
  // route table, and that route table reaches a gateway. Hovering then traces
  // a path rather than lighting up a blob.
  // A link is either a hop of the VPC path — which reads end to end — or a
  // plain relationship between two resources, which does not.
  const links = [];
  const add = (from, to, flow, panel) => {
    // Collapsed routes and attachments connect cards without a direct edge.
    if (from && to && from !== to) links.push({ from, to, flow: !!flow, panel: panel || null,
      indirect: !(deps.get(from) || []).includes(to) && !(deps.get(to) || []).includes(from) });
  };

  for (const [id, n] of nodes) {
    if (n.type !== 'aws_route_table_association') continue;
    const routeTables = depsOfType(id, m => m.type === 'aws_route_table');
    const associated = depsOfType(id, m => m.type === 'aws_subnet');
    if (associated.length) {
      for (const s of associated) for (const r of routeTables) add(s, r, true);
      continue;
    }
    // If the plan does not record which subnet, nothing is drawn: the
    // association and its subnet often share a for_each key, but matching on
    // that is a guess about names, not something the plan states.
  }
  // A route's own configuration mentions every possible kind of next hop, so
  // taking its dependencies at face value points a route at all of them. The
  // plan says which one it actually sets, and only gateways of that kind are
  // candidates.
  const rtGateways = new Map();
  for (const [id, n] of nodes) {
    if (n.type !== 'aws_route') continue;
    const routeTables = depsOfType(id, m => m.type === 'aws_route_table');
    if (!routeTables.length) continue;
    const allowed = ROUTE_TARGET_TYPES[n.meta?.route_target] || null;
    const ofKind = m => GATEWAYS.has(m.type) && (!allowed || allowed.includes(m.type));

    // Only gateways the plan actually ties to this route. Picking one by
    // zone or name when the plan is silent would put an arrow on a guess.
    const targets = depsOfType(id, ofKind);
    for (const r of routeTables) {
      for (const g of targets) {
        add(r, g, true);
        if (!rtGateways.has(r)) rtGateways.set(r, new Set());
        rtGateways.get(r).add(nodes.get(g).type);
      }
    }
  }
  // Containment is one layer deep on purpose: the VPC holds its subnets, and
  // everything further along is reached by following the path through them.
  for (const [id, n] of nodes) {
    if (n.type === 'aws_subnet')
      for (const v of depsOfType(id, m => m.type === 'aws_vpc')) add(v, id, true);
  }

  // Attachments exist only to join two resources. Collapsing them is what
  // lets an instance reach the volume or interface bound to it, which is
  // otherwise two hops away in the wrong direction.
  for (const [id, n] of nodes) {
    const pair = CONNECTORS[n.type];
    if (!pair) continue;
    for (const a of depsOfType(id, m => m.type === pair[0]))
      for (const b of depsOfType(id, m => m.type === pair[1])) add(a, b);
  }

  // A subnet is public when a route table it is associated with reaches an
  // internet gateway — the rule the AWS console itself uses.
  const subnetPublic = new Map();
  for (const { from, to } of links) {
    if (nodes.get(from)?.type !== 'aws_subnet' || nodes.get(to)?.type !== 'aws_route_table') continue;
    if ((rtGateways.get(to) || new Set()).has('aws_internet_gateway')) subnetPublic.set(from, true);
    else if (!subnetPublic.has(from)) subnetPublic.set(from, false);
  }

  const vpcs = [...nodes.values()].filter(n => n.type === 'aws_vpc');
  // A resource belongs to a VPC when it reaches one — directly, or through
  // something that does, which is how a Lambda with a vpc_config gets there
  // via its subnets. Assuming the only VPC in the workspace would put IAM
  // roles and SSM parameters inside a network they have nothing to do with.
  const vpcOf = id => {
    const direct = depsOfType(id, m => m.type === 'aws_vpc');
    if (direct.length) return direct[0];
    for (const d of deps.get(id) || []) {
      const up = depsOfType(d, m => m.type === 'aws_vpc');
      if (up.length) return up[0];
    }
    // Beyond two steps the search is limited to types that cannot exist
    // outside a VPC. For those the only open question is which one, so
    // following the chain answers it; for everything else a long chain proves
    // nothing — an alarm watching a load balancer reaches that VPC too, and
    // does not live in it.
    if (nodes.get(id)?.meta?.scope !== 'vpc') return null;
    const seen = new Set([id]);
    let frontier = [id];
    for (let step = 0; step < 4 && frontier.length; step++) {
      const next = [], found = new Set();
      for (const cur of frontier) {
        for (const d of deps.get(cur) || []) {
          if (seen.has(d)) continue;
          seen.add(d);
          if (nodes.get(d)?.type === 'aws_vpc') found.add(d);
          else next.push(d);
        }
      }
      // The nearest VPC wins, and reaching two at the same distance is a tie
      // nothing in the plan breaks.
      if (found.size === 1) return [...found][0];
      if (found.size > 1) return null;
      frontier = next;
    }
    // Still nothing, but it is in a VPC by definition — so with only one in
    // the workspace there is no doubt which.
    if (vpcs.length === 1) return vpcs[0].id;
    return null;
  };

  const panels = vpcs.map(v => ({ vpc: v, subnets: [], routeTables: [],
                                  gateways: [], inVpc: [], contents: new Map() }));
  const byVpc = new Map(panels.map(p => [p.vpc.id, p]));
  let others = [];
  for (const n of nodes.values()) {
    if (n.type === 'aws_vpc' || GLUE.has(n.type)) continue;
    const p = byVpc.get(vpcOf(n.id));
    if (!p) { others.push(n); continue; }
    if (n.type === 'aws_subnet') p.subnets.push(n);
    else if (n.type === 'aws_route_table') p.routeTables.push(n);
    else if (GATEWAYS.has(n.type)) p.gateways.push(n);
    else {
      // Something living in exactly one subnet is nested inside it; anything
      // spanning several (a load balancer, say) sits beside the columns.
      const subs = depsOfType(n.id, m => m.type === 'aws_subnet');
      if (subs.length === 1) {
        if (!p.contents.has(subs[0])) p.contents.set(subs[0], []);
        p.contents.get(subs[0]).push(n);
        add(subs[0], n.id);
      } else p.inVpc.push(n);
    }
  }
  // A NAT gateway lives in a subnet. That is a relationship rather than a hop
  // of the route path -- traffic reaches it through a route table, not by
  // leaving the subnet holding it -- so it is drawn as a plain link, which is
  // one hop and does not run on into the gateway's own routes.
  for (const p of panels) {
    for (const g of p.gateways) {
      for (const s of depsOfType(g.id, m => m.type === 'aws_subnet')) add(s, g.id);
    }
  }

  // Resources beside the columns are joined to whatever they actually use, so
  // hovering an instance shows the subnet holding it, its interfaces, its
  // volumes and its security groups. The column flow is left alone: a link is
  // only added when one end is one of these resources, never between two
  // cards that already form a hop of the VPC path.
  for (const p of panels) {
    const nested = [...p.contents.values()].flat();
    const beside = new Set([...p.inVpc, ...nested].map(n => n.id));
    const drawn = new Set([...p.subnets, ...p.routeTables, ...p.gateways,
                           ...p.inVpc, ...nested].map(n => n.id));
    for (const id of drawn) {
      for (const d of deps.get(id) || []) {
        if (!drawn.has(d)) continue;
        if (!beside.has(id) && !beside.has(d)) continue;
        if (nodes.get(d)?.type === 'aws_route_table') continue; // not a route hop
        add(id, d);
      }
    }
  }

  // Networking that serves a VPC is drawn with it: an Elastic IP held by one
  // of its NAT gateways, the transit gateway its attachment reaches, the
  // route tables on that transit gateway. Membership spreads outwards along
  // real connections, so this pulls in what is wired to the VPC and leaves an
  // unattached address where it actually is — in the region.
  const bySort = (a, b) => a.id.localeCompare(b.id);
  const placed = new Map();
  for (const p of panels) {
    for (const n of [...p.subnets, ...p.routeTables, ...p.gateways, ...p.inVpc,
                     ...[...p.contents.values()].flat()]) {
      placed.set(n.id, p);
    }
  }
  const neighbours = new Map();
  for (const e of ws.edges || []) {
    if (!neighbours.has(e.from)) neighbours.set(e.from, new Set());
    if (!neighbours.has(e.to)) neighbours.set(e.to, new Set());
    neighbours.get(e.from).add(e.to);
    neighbours.get(e.to).add(e.from);
  }
  const stray = others.filter(n => n.meta?.scope === 'network');
  for (let pass = 0; pass < 4; pass++) {
    let joined = false;
    for (const n of stray) {
      if (placed.has(n.id)) continue;
      for (const other of neighbours.get(n.id) || []) {
        const panel = placed.get(other);
        if (!panel) continue;
        panel.inVpc.push(n);
        placed.set(n.id, panel);
        joined = true;
        break;
      }
    }
    if (!joined) break; // nothing more reaches a VPC
  }
  others = others.filter(n => !placed.has(n.id));

  // A load balancer is a path in its own right, and the console gives it a map
  // of its own for the same reason this does: listing a balancer, its
  // listeners, its rules and its target groups side by side says nothing about
  // which rule reaches which group. Read as columns, it does.
  panels.forEach((p, pi) => {
    p.lbs = [];
    for (const lb of p.inVpc.filter(n => n.type === 'aws_lb')) {
      const key = 'lb-' + pi + '-' + p.lbs.length;
      const listeners = usedByType(lb.id, m => m.type === 'aws_lb_listener').map(id => nodes.get(id));
      const rules = [], groups = new Map(), targets = [];
      for (const l of listeners) {
        add(lb.id, l.id, true, key);
        // A listener's own default action names a target group directly; that
        // is the path taken when no rule matches.
        for (const tg of depsOfType(l.id, m => m.type === 'aws_lb_target_group')) {
          groups.set(tg, true); add(l.id, tg, true, key);
        }
        for (const rid of usedByType(l.id, m => m.type === 'aws_lb_listener_rule')) {
          rules.push(nodes.get(rid));
          add(l.id, rid, true, key);
          for (const tg of depsOfType(rid, m => m.type === 'aws_lb_target_group')) {
            groups.set(tg, true); add(rid, tg, true, key);
          }
        }
      }
      // Targets hang off the attachment that binds them, which is drawn as the
      // line rather than as a card, the way routes and associations are.
      for (const tg of groups.keys()) {
        const target = t => {
          add(tg, t, true, key);
          if (!targets.includes(t)) targets.push(t);
        };
        for (const aid of usedByType(tg, m => m.type === 'aws_lb_target_group_attachment')) {
          for (const t of depsOfType(aid, m => m.type !== 'aws_lb_target_group')) target(t);
        }
        // Hardly any codebase registers targets one at a time. An auto scaling
        // group or a service does it, and that is what is behind the group.
        for (const t of usedByType(tg, m => TARGET_PROVIDERS.has(m.type))) target(t);
      }
      p.lbs.push({ key, lb, listeners: listeners.sort(bySort), rules: rules.sort(bySort),
                   groups: [...groups.keys()].map(id => nodes.get(id)).sort(bySort),
                   targets: targets.map(id => nodes.get(id)).sort(bySort) });
    }
    // What the load balancer map draws is not also listed beside the columns.
    const claimed = new Set();
    for (const stack of p.lbs) {
      claimed.add(stack.lb.id);
      for (const list of [stack.listeners, stack.rules, stack.groups]) {
        for (const n of list) claimed.add(n.id);
      }
    }
    p.inVpc = p.inVpc.filter(n => !claimed.has(n.id));
  });

  // What genuinely is not part of a VPC still lives somewhere: an SSM
  // parameter belongs to the region, an IAM role to the account.
  const scopes = { region: [], network: [], account: [], external: [], vpc: [] };
  for (const n of others) (scopes[n.meta?.scope] || scopes.external).push(n);
  // Networking that reached no VPC is simply regional — and so is something
  // that is certainly in a VPC but could not be tied to one of those drawn.
  // Neither is "outside AWS", which is what an unknown scope used to mean.
  scopes.region.push(...scopes.network, ...scopes.vpc);
  scopes.network = [];
  scopes.vpc = [];

  for (const p of panels) {
    p.subnets.sort(bySort); p.routeTables.sort(bySort);
    p.gateways.sort(bySort); p.inVpc.sort(bySort);
  }
  others.sort(bySort);
  for (const list of Object.values(scopes)) list.sort(bySort);

  // A pair the load balancer map draws is drawn there, in its own columns. The
  // general pass reached some of the same pairs, and keeping both would double
  // every line -- and leave the copy without a panel free to attach itself to
  // whichever card happened to be rendered first.
  const inPanel = new Set();
  for (const l of links) if (l.panel) inPanel.add(l.from + ' ' + l.to);

  const byPair = new Map();
  for (const l of links) {
    if (!l.panel && inPanel.has(l.from + ' ' + l.to)) continue;
    const key = (l.panel || '') + ' ' + l.from + ' ' + l.to;
    const prev = byPair.get(key);
    if (!prev) byPair.set(key, l);
    else if (l.flow) prev.flow = true; // a pair that is ever a hop stays one
  }
  const unique = [...byPair.values()];
  const region = [...nodes.values()].find(n => n.meta?.region)?.meta.region || '';
  return { workspace: ws.name, panels, others, scopes, region, links: unique, nodes, subnetPublic };
}

// ---------- render map --------------------------------------------------
// ---------- filtering ---------------------------------------------------
const STATUSES = ['create', 'update', 'replace', 'destroy', 'existing'];
const CHANGED = new Set(['create', 'update', 'replace', 'destroy']);
const filter = { text: '', statuses: new Set() };

const filterActive = () => filter.text !== '' || filter.statuses.size > 0;

// A resource matches on its address, type, friendly type name, or the few
// attributes shown on its card — so "10.0.1" or "nat" both find things.
function matches(n) {
  if (filter.statuses.size && !filter.statuses.has(n.status)) return false;
  if (!filter.text) return true;
  const hay = [n.id, n.type, label(n.type), n.meta?.name, n.meta?.cidr,
               n.meta?.az, n.meta?.spec, n.meta?.id]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(filter.text);
}

// visibleIn returns the ids to draw for one workspace. A container stays
// visible when something inside it matches, so a matching instance is never
// shown without the subnet that holds it.
function visibleIn(ws, m) {
  const vis = new Set();
  for (const n of ws.nodes || []) if (matches(n)) vis.add(n.id);
  for (const p of m.panels) {
    for (const [subnetID, kids] of p.contents) {
      if (kids.some(k => vis.has(k.id))) vis.add(subnetID);
    }
  }
  return vis;
}

function renderChips(state) {
  const restoreFocus = preserveFocus();
  const counts = {};
  for (const s of STATUSES) counts[s] = 0;
  for (const ws of state.workspaces || []) {
    for (const n of ws.nodes || []) counts[n.status] = (counts[n.status] || 0) + 1;
  }
  $('chips').innerHTML = STATUSES.map(s => `
    <button type="button" class="chip ${s} ${filter.statuses.has(s) ? 'on' : ''} ${counts[s] ? '' : 'zero'}"
      data-status="${s}" aria-pressed="${filter.statuses.has(s)}" title="Filter ${s} resources">${ACTION_NAMES[s]} <b>${counts[s]}</b></button>`).join('');
  for (const btn of $('chips').querySelectorAll('.chip')) {
    btn.addEventListener('click', () => {
      const s = btn.dataset.status;
      filter.statuses.has(s) ? filter.statuses.delete(s) : filter.statuses.add(s);
      if (latest) paint(latest);
      $('chips').querySelector(`[data-status="${s}"]`)?.focus();
    });
  }
  $('clear').hidden = !filterActive() && !reviewService && !changesOnly && !reviewWorkspace;
  restoreFocus();
}

let RENDER_WS = ''; // workspace whose cards are being emitted

function cardHTML(n, detail, nested) {
  const nice = displayName(n);
  let det = detail !== undefined && detail !== null ? detail
    : (n.meta?.cidr || n.meta?.spec || n.meta?.az || '');
  // Keep the resource name visible when the title came from somewhere else,
  // so two cards are never indistinguishable.
  if (nice !== shortRef(n)) det = det ? det + ' · ' + shortRef(n) : shortRef(n);
  return `<div class="card ${n.status}" data-id="${esc(n.id)}" data-ws="${esc(RENDER_WS)}"
      title="${esc(n.id)}">
    <button type="button" class="card-main" aria-pressed="false"
      aria-label="${esc(`Pin path: ${nice}, ${label(n.type)}, ${n.status}`)}">
      <span class="ico">${iconSVG(n.type)}</span>
      <span class="n">${esc(nice)}</span>
      <span class="d"><span>${esc(label(n.type))}${det ? ' · ' + esc(det) : ''}</span>
        <span class="st">${esc(n.status)}</span></span>
    </button>
    <button type="button" class="card-detail" aria-label="${esc(`View details for ${n.id}`)}"
      title="View details">&#9432;</button>
    ${nested || ''}
  </div>`;
}

// groupedHTML lists resources under a heading per type, so a dozen mixed
// cards read as "3 instances, 4 interfaces, 2 volumes" instead of a wall.
function groupedHTML(list, stacked) {
  const byType = new Map();
  for (const n of list) {
    if (!byType.has(n.type)) byType.set(n.type, []);
    byType.get(n.type).push(n);
  }
  const rank = t => {
    const i = CATEGORY_ORDER.indexOf(t);
    return i === -1 ? CATEGORY_ORDER.length : i;
  };
  const blocks = [...byType.entries()]
    .sort((a, b) => rank(a[0]) - rank(b[0]) || label(a[0]).localeCompare(label(b[0])))
    .map(([type, items]) => `<div class="cat">
        <h4>${iconSVG(type)}<span>${esc(label(type))}</span>
          <em>${items.length}</em></h4>
        <div class="${stacked ? 'stack' : 'grid'}">${items.map(n => cardHTML(n)).join('')}</div>
      </div>`).join('');
  return stacked ? blocks : `<div class="cats">${blocks}</div>`;
}

// AWS computes a load balancer's scheme, so a workspace that has never been
// applied does not have it. The flag the configuration did set says the same
// thing, and is there either way.
function schemeOf(lb) {
  if (lb.meta?.scheme) return lb.meta.scheme;
  if (lb.meta?.internal === 'true') return 'internal';
  if (lb.meta?.internal === 'false') return 'internet-facing';
  return '';
}

// lbPanelHTML draws a load balancer the way the console's own resource map
// does: the balancer, what it listens on, the rules that choose between target
// groups, the groups themselves, and what is actually behind them.
function lbPanelHTML(stack, m, vis) {
  const keep = list => list.filter(n => vis.has(n.id));
  const listeners = keep(stack.listeners), rules = keep(stack.rules);
  const groups = keep(stack.groups), targets = keep(stack.targets);
  const lbShown = vis.has(stack.lb.id);
  if (!lbShown && !listeners.length && !rules.length && !groups.length && !targets.length) {
    return ''; // nothing in this load balancer survived the filter
  }
  // A listener is told apart by the port it answers on, a rule by what it
  // matches, a target group by where it forwards. Without those the columns
  // would be rows of identically named cards.
  const portOf = n => [n.meta?.protocol, n.meta?.port].filter(Boolean).join(':');
  const ruleOf = n => [n.meta?.priority ? '#' + n.meta.priority : '', n.meta?.match]
    .filter(Boolean).join(' · ');
  const col = (title, items, detail) => `<div class="col">
      <h3>${title} <span>(${items.length})</span></h3>
      ${items.length ? items.map(n => cardHTML(n, detail ? detail(n) : undefined)).join('')
                     : '<div class="empty">none</div>'}
    </div>`;

  return `<div class="vpc-panel lb-panel" data-panel="${esc(stack.key)}">
    <div class="vpc-head">
      <span class="title">${esc(stack.lb.meta?.name || stack.lb.name)}</span>
      <span class="sub">${esc([stack.lb.meta?.spec, schemeOf(stack.lb)]
        .filter(Boolean).join(' · '))}</span>
    </div>
    <div class="cols">
      <div class="col"><h3>Load balancer</h3>${
        lbShown ? cardHTML(stack.lb) : '<div class="empty">none</div>'}</div>
      ${col('Listeners', listeners, portOf)}
      ${col('Rules', rules, ruleOf)}
      ${col('Target groups', groups, portOf)}
      ${col('Targets', targets)}
    </div>
  </div>`;
}

function panelHTML(p, m, vis) {
  const keep = list => list.filter(n => vis.has(n.id));
  const subnets = keep(p.subnets), routeTables = keep(p.routeTables);
  const gateways = keep(p.gateways), inVpc = keep(p.inVpc);
  const vpcShown = vis.has(p.vpc.id);
  if (!vpcShown && !subnets.length && !routeTables.length && !gateways.length && !inVpc.length) {
    return ''; // nothing in this VPC survived the filter
  }

  const byAz = new Map();
  for (const s of subnets) {
    const az = s.meta?.az || 'no availability zone';
    if (!byAz.has(az)) byAz.set(az, []);
    byAz.get(az).push(s);
  }
  const subnetCol = [...byAz.entries()].sort().map(([az, subs]) => `
    <div class="az"><h4>${esc(az)}</h4>
      ${subs.map(s => {
        const inside = keep(p.contents.get(s.id) || []);
        const nested = inside.length
          ? `<div class="contents">${inside.map(c => cardHTML(c)).join('')}</div>` : '';
        // Public and private are answers; a subnet with no known route table
        // association is a question, and labelling it private would state an
        // answer the plan never gave.
        return cardHTML(s, [m.subnetPublic.has(s.id)
                              ? (m.subnetPublic.get(s.id) ? 'public' : 'private') : null,
                            s.meta?.cidr].filter(Boolean).join(' · '), nested);
      }).join('')}
    </div>`).join('') || '<div class="empty">none</div>';

  const col = (title, items) => {
    const types = new Set(items.map(n => n.type));
    // A mixed column reads better under headings — a NAT gateway should be
    // findable as a NAT gateway, not as one of seven "network connections".
    const body = !items.length ? '<div class="empty">none</div>'
      : types.size > 1 ? groupedHTML(items, true)
      : items.map(n => cardHTML(n)).join('');
    return `<div class="col"><h3>${title} <span>(${items.length})</span></h3>${body}</div>`;
  };

  return `<div class="vpc-panel">
    <div class="vpc-head">
      <span class="title">${esc(p.vpc.meta?.name || p.vpc.name)}</span>
      <span class="sub">${esc(p.vpc.meta?.cidr || '')} ${esc(p.vpc.meta?.id || '')}</span>
    </div>
    <div class="cols">
      <div class="col"><h3>VPC</h3>${vpcShown ? cardHTML(p.vpc) : '<div class="empty">none</div>'}</div>
      <div class="col"><h3>Subnets <span>(${subnets.length})</span></h3>${subnetCol}</div>
      ${col('Route tables', routeTables)}
      ${col('Network connections', gateways)}
    </div>
  </div>` + (p.lbs || []).map(stack => lbPanelHTML(stack, m, vis)).join('')
    + (inVpc.length ? `<div class="others">
      <h3>In this VPC <span>(${inVpc.length})</span></h3>
      ${groupedHTML(inVpc)}
    </div>` : '');
}

// summaryHTML gives each workspace a plan-style tally, so the interesting
// number is visible without reading every card.
function summaryHTML(nodes) {
  const counts = {};
  for (const n of nodes || []) counts[n.status] = (counts[n.status] || 0) + 1;
  const parts = STATUSES.filter(s => counts[s]).map(s =>
    `<span class="pill ${s}">${counts[s]} ${s}</span>`);
  return parts.length ? `<span style="display:flex;gap:5px">${parts.join('')}</span>` : '';
}

// The tool that produced a plan, written the way its own project writes it.
// A workspace planned before this was recorded says nothing, and Terraform is
// the safe thing to call it then.
const CLI_NAMES = {terraform: 'Terraform', tofu: 'OpenTofu'};
const cliName = ws => CLI_NAMES[ws.cli] || 'Terraform';

function renderMap(state) {
  const restoreFocus = preserveFocus();
  const body = $('mapbody');
  const maps = [];
  let shown = 0, total = 0;

  body.innerHTML = (state.workspaces || []).map(ws => {
    RENDER_WS = ws.name;
    const m = buildMap(ws);
    maps.push(m);
    const vis = visibleIn(ws, m);
    total += (ws.nodes || []).length;
    shown += vis.size;

    const head = `<div class="ws-head">
        <h2>${esc(ws.name)}</h2>
        <span class="sub">${ws.terraformVersion ? esc(cliName(ws)) + ' ' + esc(ws.terraformVersion) + ' · ' : ''}${(ws.nodes || []).length} resources</span>
        ${summaryHTML(ws.nodes)}
        ${ws.rebuilding ? '<span class="spin">re-planning…</span>' : ''}
      </div>`;
    const err = ws.error ? `<div class="ws-err">${esc(ws.error)}</div>` : '';
    let inner = m.panels.map(p => panelHTML(p, m, vis)).join('');
    // Sections widen outwards: the VPC panels, then the region around them,
    // then the account, then what is not AWS at all.
    const sections = [
      ['region', m.region ? `Elsewhere in ${m.region}` : 'Elsewhere in the region'],
      ['account', 'Account-wide'],
      ['external', 'Outside AWS'],
    ];
    for (const [key, title] of sections) {
      const list = (m.scopes[key] || []).filter(n => vis.has(n.id));
      if (!list.length) continue;
      inner += `<div class="others">
          <h3>${esc(title)} <span>(${list.length})</span></h3>
          ${groupedHTML(list)}
        </div>`;
    }
    if (!inner && !err) {
      inner = `<div class="empty">${(ws.nodes || []).length && filterActive()
        ? 'Nothing here matches the current filter.' : 'No resources in this plan.'}</div>`;
    }
    return `<section class="ws">${head}${err}${inner}</section>`;
  }).join('');

  $('shown').textContent = filterActive() ? `${shown} of ${total} shown` : `${total} resources`;
  drawRibbons(maps);
  wireHover(maps);
  restoreFocus();
}

// Prefer short orthogonal paths; longer associations can use clear card gutters.
function ribbonRoute(A, B, obstacles) {
  const ports = r => [
    [{x: r.x, y: r.y + r.h / 2}, {x: r.x - 10, y: r.y + r.h / 2}],
    [{x: r.x + r.w, y: r.y + r.h / 2}, {x: r.x + r.w + 10, y: r.y + r.h / 2}],
    [{x: r.x + r.w / 2, y: r.y}, {x: r.x + r.w / 2, y: r.y - 10}],
    [{x: r.x + r.w / 2, y: r.y + r.h}, {x: r.x + r.w / 2, y: r.y + r.h + 10}],
  ];
  const blocked = (a, b) => obstacles.some(r => a.x === b.x
    ? a.x > r.x && a.x < r.x + r.w && Math.max(a.y, b.y) > r.y && Math.min(a.y, b.y) < r.y + r.h
    : a.y > r.y && a.y < r.y + r.h && Math.max(a.x, b.x) > r.x && Math.min(a.x, b.x) < r.x + r.w);
  let best = null, score = Infinity;
  const consider = points => {
    const cost = points.slice(1).reduce((sum, p, i) => sum + Math.abs(p.x - points[i].x) + Math.abs(p.y - points[i].y), points.length * 8);
    if (cost >= score || points.some(p => p.x < 4 || p.y < 4)) return;
    if (points.slice(1).some((p, i) => blocked(points[i], p))) return;
    best = points; score = cost;
  };
  const starts = ports(A), ends = ports(B);
  for (const [a, start] of starts) for (const [b, end] of ends) {
    consider([a, start, {x: end.x, y: start.y}, end, b]);
    consider([a, start, {x: start.x, y: end.y}, end, b]);
  }
  if (!best) {
    const xs = [...new Set(obstacles.flatMap(r => [r.x - 10, r.x + r.w + 10]))];
    const ys = [...new Set(obstacles.flatMap(r => [r.y - 10, r.y + r.h + 10]))];
    for (const [a, start] of starts) for (const [b, end] of ends) {
      for (const y of ys) consider([a, start, {x: start.x, y}, {x: end.x, y}, end, b]);
      for (const x of xs) consider([a, start, {x, y: start.y}, {x, y: end.y}, end, b]);
    }
    // Cross-panel links may need separate exit and entry lanes.
    if (!best) for (const [a, start] of starts) for (const [b, end] of ends) {
      for (const y1 of [A.y - 10, A.y + A.h + 10]) for (const y2 of [B.y - 10, B.y + B.h + 10]) {
        for (const x of xs) consider([a, start, {x: start.x, y: y1}, {x, y: y1},
          {x, y: y2}, {x: end.x, y: y2}, end, b]);
      }
    }
  }
  // Extremely dense layouts retain the association via the outer gutter.
  if (!best) {
    const rail = Math.max(4, Math.min(A.x, B.x) - 10);
    best = [starts[0][0], {x: rail, y: starts[0][0].y}, {x: rail, y: ends[0][0].y}, ends[0][0]];
  }
  return best.map((p, i) => `${i ? 'L' : 'M'} ${p.x} ${p.y}`).join(' ');
}

function drawRibbons(maps) {
  const svg = $('ribbons');
  svg.innerHTML = `<defs>${['direct', 'indirect'].map(kind =>
    `<marker id="map-${kind}" viewBox="0 0 12 12" refX="11" refY="6"
      markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <circle class="connection-dot ${kind}" cx="6" cy="6" r="4"/></marker>`).join('')}</defs>`;
  // Exclude the previous overlay size when measuring after a resize/filter.
  svg.setAttribute('width', '0');
  svg.setAttribute('height', '0');
  const scroll = $('map');
  const base = scroll.getBoundingClientRect();
  svg.setAttribute('width', scroll.scrollWidth);
  svg.setAttribute('height', scroll.scrollHeight);
  const rectOf = el => {
    const r = el.querySelector('.card-main').getBoundingClientRect();
    return { x: r.left - base.left + scroll.scrollLeft,
             y: r.top - base.top + scroll.scrollTop, w: r.width, h: r.height };
  };
  const obstacles = [...scroll.querySelectorAll('.card')].map(rectOf);
  // An instance appears both in the subnet holding it and in the targets of
  // the load balancer reaching it. A link belonging to one panel has to find
  // the copy in that panel, or every line would run to whichever was drawn
  // first.
  const box = (id, panel, workspace) => {
    const selector = `.card[data-ws="${CSS.escape(workspace)}"][data-id="${CSS.escape(id)}"]`;
    const within = panel
      ? scroll.querySelector(`[data-panel="${CSS.escape(panel)}"] ${selector}`)
      : null;
    const el = within || scroll.querySelector(selector);
    if (!el) return null;
    return rectOf(el);
  };
  for (const m of maps) {
    for (const { from, to, panel, indirect } of m.links) {
      const A = box(from, panel, m.workspace), B = box(to, panel, m.workspace);
      if (!A || !B) continue;
      const p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', ribbonRoute(A, B, obstacles));
      p.setAttribute('fill', 'none');
      const kind = indirect ? 'indirect' : 'direct';
      p.setAttribute('class', `connection ${kind}`);
      p.setAttribute('stroke-width', '2');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-linejoin', 'round');
      p.setAttribute('marker-end', `url(#map-${kind})`);
      if (indirect) p.setAttribute('stroke-dasharray', '5 4');
      // Nothing is drawn until a card is hovered: the map reads as columns of
      // resources, and the connections are the answer to pointing at one.
      p.setAttribute('opacity', '0');
      p.dataset.from = from; p.dataset.to = to; p.dataset.ws = m.workspace;
      svg.appendChild(p);
    }
  }
}

// adjacencyOf splits links by kind and direction, which is what lets the two
// be traced differently.
function adjacencyOf(links) {
  const adj = { outFlow: new Map(), intoFlow: new Map(),
                outRel: new Map(), intoRel: new Map() };
  const put = (map, k, v) => { if (!map.has(k)) map.set(k, new Set()); map.get(k).add(v); };
  for (const l of links) {
    put(l.flow ? adj.outFlow : adj.outRel, l.from, l.to);
    put(l.flow ? adj.intoFlow : adj.intoRel, l.to, l.from);
  }
  return adj;
}

// tracePath answers "what is this resource's place in the network".
//
// The VPC path is followed end to end, because subnet to route table to
// gateway is a single question. Ordinary relationships stop at one hop: an
// instance should show the interfaces, volumes and subnet that are its own,
// not everything those in turn touch, which on a real codebase is most of
// the account. Each direction is walked separately, which is what keeps a
// sibling subnet out — reaching it would mean going forward to the shared
// route table and then back again.
function tracePath(id, adj) {
  const nodes = new Set([id]);
  const edges = new Set();
  const step = (from, to, forward) => {
    edges.add(forward ? from + ' ' + to : to + ' ' + from);
    nodes.add(to);
  };
  const walkFlow = (map, forward) => {
    const queue = [id], seen = new Set([id]);
    while (queue.length) {
      const cur = queue.shift();
      for (const next of map.get(cur) || []) {
        step(cur, next, forward);
        if (!seen.has(next)) { seen.add(next); queue.push(next); }
      }
    }
  };
  walkFlow(adj.outFlow, true);
  walkFlow(adj.intoFlow, false);
  for (const next of adj.outRel.get(id) || []) step(id, next, true);
  for (const prev of adj.intoRel.get(id) || []) step(id, prev, false);
  return { nodes, edges };
}

// Set by wireHover so the hover behaviour can be exercised without a pointer.
let hoverApi = null;
// A pinned card keeps its path on screen while you scroll away from it, and
// survives the redraw that a re-plan causes.
let pinnedId = null, pinnedWorkspace = null;

function nodeById(id, workspace) {
  for (const ws of (latest?.workspaces) || []) {
    if (ws.name !== workspace) continue;
    for (const n of ws.nodes || []) if (n.id === id) return n;
  }
  return null;
}

function renderPinnedNote() {
  const el = $('pinned');
  const visible = !!pinnedId && tab === 'map';
  el.hidden = !visible;
  $('release-pin').hidden = !visible;
  if (!visible) { el.textContent = ''; return; }
  const n = nodeById(pinnedId, pinnedWorkspace);
  el.hidden = false;
  el.textContent = `${pinnedWorkspace} / ${n ? displayName(n) : pinnedId}`;
}

function wireHover(maps) {
  const scroll = $('map');
  const cards = [...scroll.querySelectorAll('.card')];
  const paths = [...$('ribbons').querySelectorAll('path')];
  const adjByWorkspace = new Map(maps.map(m => [m.workspace, adjacencyOf(m.links)]));
  const workspaceFor = (id, workspace) => workspace ?? cards.find(c => c.dataset.id === id)?.dataset.ws;
  const resetPaths = () => {
    cards.forEach(c => c.classList.remove('dim', 'hi'));
    paths.forEach(p => p.setAttribute('opacity', '0'));
  };
  const applyPath = (id, workspace) => {
    resetPaths();
    const adj = adjByWorkspace.get(workspace);
    if (!adj) return;
    const { nodes, edges } = tracePath(id, adj);
    cards.forEach(c => {
      const on = c.dataset.ws === workspace && nodes.has(c.dataset.id);
      c.classList.toggle('dim', !on);
      c.classList.toggle('hi', on);
    });
    paths.forEach(p => {
      p.setAttribute('opacity',
        p.dataset.ws === workspace && edges.has(p.dataset.from + ' ' + p.dataset.to) ? '1' : '0');
    });
  };

  // While a card is pinned the pointer stops driving the highlight, so
  // scrolling away from it — or across other cards — leaves it in place.
  const hover = (id, workspace) => { if (!pinnedId) applyPath(id, workspaceFor(id, workspace)); };
  const clear = () => { if (!pinnedId) resetPaths(); };

  const setPinned = (id, workspace) => {
    pinnedId = id;
    pinnedWorkspace = id ? workspaceFor(id, workspace) : null;
    cards.forEach(c => {
      const pinned = !!id && c.dataset.id === id && c.dataset.ws === pinnedWorkspace;
      c.classList.toggle('pinned', pinned);
      c.querySelector('.card-main').setAttribute('aria-pressed', String(pinned));
    });
    if (id) applyPath(id, pinnedWorkspace); else resetPaths();
    renderPinnedNote();
  };

  hoverApi = { hover, clear, pin: setPinned, pinned: () => pinnedId };

  for (const card of cards) {
    const id = card.dataset.id, workspace = card.dataset.ws;
    card.addEventListener('mouseenter', () => hover(id, workspace));
    card.addEventListener('mouseleave', clear);
    const main = card.querySelector('.card-main');
    const detail = card.querySelector('.card-detail');
    main.addEventListener('focus', () => hover(id, workspace));
    main.addEventListener('blur', clear);
    detail.addEventListener('click', ev => {
      ev.stopPropagation();
      openDetail(card.dataset.ws, id, detail);
    });
    detail.addEventListener('dblclick', ev => ev.stopPropagation());
    // A single click locks the path, so it holds still while you read across
    // it; a double click opens the resource's details. The second click of a
    // double arrives here too, and is left alone — the card is already locked,
    // and the drawer opens on top of it.
    card.addEventListener('click', ev => {
      ev.stopPropagation(); // a nested card locks itself, not its subnet
      if (ev.detail > 1) return; // the second half of a double click
      setPinned(pinnedId === id && pinnedWorkspace === workspace ? null : id, workspace);
    });
    card.addEventListener('dblclick', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      openDetail(card.dataset.ws, id, main);
    });
  }

  // Re-applied after a redraw so a re-plan does not drop the pin.
  if (pinnedId && cards.some(c => c.dataset.id === pinnedId && c.dataset.ws === pinnedWorkspace)) setPinned(pinnedId, pinnedWorkspace);
  else if (pinnedId) setPinned(null);
}

const SKIP_ATTRS = new Set(['tags_all']);
// Attributes worth leading with, per resource type, so the useful line is
// visible before the long tail of defaults.
const SUMMARY_KEYS = {
  aws_route: ['destination_cidr_block', 'destination_ipv6_cidr_block', 'gateway_id',
              'nat_gateway_id', 'transit_gateway_id', 'vpc_peering_connection_id',
              'network_interface_id'],
  aws_route_table_association: ['subnet_id', 'route_table_id'],
  aws_volume_attachment: ['device_name', 'volume_id', 'instance_id'],
  aws_lb_target_group_attachment: ['target_id', 'port'],
  aws_instance: ['instance_type', 'ami', 'subnet_id', 'private_ip'],
  aws_subnet: ['cidr_block', 'availability_zone'],
  aws_vpc: ['cidr_block'],
  aws_eip: ['domain', 'public_ip'],
  aws_ebs_volume: ['size', 'type', 'availability_zone'],
  aws_lb: ['load_balancer_type', 'internal'],
  aws_lb_listener: ['port', 'protocol'],
  aws_lb_target_group: ['port', 'protocol'],
  aws_security_group: ['name', 'name_prefix', 'description'],

function fmtValue(v) {
  if (v === null || v === undefined) return '<span class="unk">null</span>';
  if (typeof v === 'object') return `<pre>${esc(JSON.stringify(v, null, 1))}</pre>`;
  if (v === '') return '<span class="unk">""</span>';
  return esc(String(v));
}

// One row per attribute: unknown values read as Terraform prints them, and a
// changed value shows what it was next to what it becomes.
function attrRows(after, before, unknown) {
  const unk = new Set(unknown || []);
  const keys = new Set([...Object.keys(after || {}), ...unk,
                        ...(before ? Object.keys(before) : [])]);
  const rows = [...keys].filter(k => !SKIP_ATTRS.has(k)).sort().map(k => {
    let cell;
    if (unk.has(k) && (after?.[k] === undefined || after?.[k] === null)) {
      cell = '<span class="unk">(known after apply)</span>';
    } else {
      const a = after?.[k], b = before?.[k];
      const changed = before && JSON.stringify(a) !== JSON.stringify(b);
      cell = changed
        ? `<span class="was">${fmtValue(b)}</span><br><span class="now">${fmtValue(a)}</span>`
        : fmtValue(a);
    }
    if (cell === '<span class="unk">null</span>' && !unk.has(k)) return '';
    return `<tr><td class="k">${esc(k)}</td><td class="v">${cell}</td></tr>`;
  }).filter(Boolean).join('');
  return rows ? `<table class="attrs">${rows}</table>`
              : '<div class="none">no attributes</div>';
}

function summarize(type, after, unknown) {
  const unk = new Set(unknown || []);
  const parts = [];
  for (const k of SUMMARY_KEYS[type] || []) {
    if (unk.has(k) && (after?.[k] === undefined || after?.[k] === null)) {
      parts.push(`${k}=(known after apply)`);
    } else if (after?.[k] !== undefined && after?.[k] !== null && after?.[k] !== '') {
      parts.push(`${k}=${after[k]}`);
    }
    if (parts.length >= 3) break;
  }
  return parts.join('  ');
}

function relatedHTML(r) {
  const short = r.address.replace(/^module\..*?\./, '');
  return `<details class="rel">
    <summary>
      <span class="ico">${iconSVG(r.type)}</span>
      <span><b>${esc(label(r.type || '?'))}</b> ${esc(short)}</span>
      <span class="pill ${esc(r.status)}" style="margin-left:auto">${esc(r.status || '')}</span>
    </summary>
    <div class="inner">
      ${summarize(r.type, r.after, r.unknown)
        ? `<div class="sum" style="margin-bottom:6px">${esc(summarize(r.type, r.after, r.unknown))}</div>` : ''}
      ${attrRows(r.after, null, r.unknown)}
    </div>
  </details>`;
}

let detailRequest = 0, detailOpener = null, detailFocus = null;
async function openDetail(wsName, address, opener) {
  const request = ++detailRequest;
  const drawer = $('drawer');
  detailOpener = opener || document.activeElement;
  detailFocus = focusReference(detailOpener);
  $('dr-ico').innerHTML = '';
  $('dr-pill').textContent = '';
  $('dr-pill').className = '';
  drawer.classList.add('open');
  $('dr-title').textContent = address.split('.').slice(-2).join('.');
  $('dr-addr').textContent = `${wsName} · ${address}`;
  $('dr-body').innerHTML = '<div class="none">loading…</div>';
  if (!drawer.open) drawer.showModal();
  $('dr-close').focus();
  let d;
  try {
    const res = await fetch(`/resource?workspace=${encodeURIComponent(wsName)}` +
                            `&address=${encodeURIComponent(address)}`);
    if (!res.ok) throw new Error(await res.text());
    d = await res.json();
  } catch (err) {
    if (request !== detailRequest) return;
    $('dr-body').innerHTML = `<div class="ws-err">${esc(err.message)}</div>`;
    return;
  }
  // A slow response must not replace a newer selection or a closed drawer.
  if (request !== detailRequest) return;
  $('dr-ico').innerHTML = iconSVG(d.type);
  $('dr-title').textContent = `${label(d.type)} · ${d.name}${idx(d.address)}`;
  const pill = $('dr-pill');
  pill.textContent = d.status;
  pill.className = 'pill ' + d.status;

  const sec = (title, html) => `<h3>${title}</h3>${html}`;
  const rels = list => list && list.length
    ? list.map(relatedHTML).join('') : '<div class="none">none</div>';
  // "Attached" is what points at this resource: a route table's routes and
  // associations, an instance's volume and target-group attachments.
  $('dr-body').innerHTML =
    sec(`Attached <span style="color:var(--faint)">(${(d.attached || []).length})</span>`, rels(d.attached)) +
    sec('Configuration', attrRows(d.after, d.status === 'update' || d.status === 'replace' ? d.before : null, d.unknown)) +
    sec(`Depends on <span style="color:var(--faint)">(${(d.dependsOn || []).length})</span>`, rels(d.dependsOn));
}

// ---------- graph tab ---------------------------------------------------
const elk = new ELK();
const CHAR = 7.3, PAD_X = 14, NODE_H = 64;
let view = { x: 0, y: 0, k: 1 }, firstGraphDraw = true;
let graphLayout = null;
const world = document.createElementNS(svgNS, 'g');
$('graph').appendChild(world);
const applyView = () => world.setAttribute('transform',
  `translate(${view.x},${view.y}) scale(${view.k})`);
function fitGraph() {
  if (!graphLayout?.width || !graphLayout?.height) return;
  const r = $('graph').getBoundingClientRect();
  const k = Math.min(r.width / (graphLayout.width + 64), r.height / (graphLayout.height + 64), 1.25);
  view = {x: (r.width - graphLayout.width * k) / 2, y: (r.height - graphLayout.height * k) / 2, k};
  applyView();
}
function zoomGraph(factor) {
  const r = $('graph').getBoundingClientRect();
  const next = Math.max(0.1, Math.min(3, view.k * factor)), f = next / view.k;
  view = {x: r.width / 2 - (r.width / 2 - view.x) * f, y: r.height / 2 - (r.height / 2 - view.y) * f, k: next};
  applyView();
}
$('graph').addEventListener('keydown', e => {
  if (e.target !== $('graph')) return;
  if (e.key === '+' || e.key === '=') zoomGraph(1.25);
  else if (e.key === '-') zoomGraph(0.8);
  else if (e.key === '0') fitGraph();
  else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    view.x += e.key === 'ArrowLeft' ? 40 : e.key === 'ArrowRight' ? -40 : 0;
    view.y += e.key === 'ArrowUp' ? 40 : e.key === 'ArrowDown' ? -40 : 0;
    applyView();
  } else return;
  e.preventDefault();
});
$('graph').addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015);
  const r = $('graph').getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  view.x = mx - (mx - view.x) * f; view.y = my - (my - view.y) * f; view.k *= f;
  applyView();
}, { passive: false });
let pan = null;
$('graph').addEventListener('mousedown', e => {
  pan = { x: e.clientX - view.x, y: e.clientY - view.y };
  $('graph').classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!pan) return;
  view.x = e.clientX - pan.x; view.y = e.clientY - pan.y; applyView();
});
window.addEventListener('mouseup', () => { pan = null; $('graph').classList.remove('panning'); });

function toElk(state, includeContext = false) {
  const groups = new Map();
  const root = { id: '__root__', layoutOptions: {
      'elk.algorithm': 'layered', 'elk.direction': 'RIGHT', 'elk.edgeRouting': 'ORTHOGONAL',
      'elk.hierarchyHandling': 'INCLUDE_CHILDREN', 'elk.spacing.nodeNode': '24',
      'elk.layered.spacing.nodeNodeBetweenLayers': '56',
      'elk.padding': '[top=20,left=20,bottom=20,right=20]' },
    children: [], edges: [] };
  groups.set('', root);
  // Group keys are "<workspace>" or "<workspace>|<module address>", so the
  // parent of any key is everything before its last separator — and the
  // parent of a bare workspace is the root.
  const groupFor = (addr, labelText) => {
    if (groups.has(addr)) return groups.get(addr);
    const parentAddr = addr.includes('|') ? addr.slice(0, addr.lastIndexOf('|')) : '';
    const parent = groupFor(parentAddr);
    const g = { id: 'group:' + addr, isModule: true,
      label: labelText || addr.slice(addr.lastIndexOf('|') + 1),
      layoutOptions: { 'elk.padding': '[top=34,left=16,bottom=16,right=16]' },
      children: [], edges: [] };
    parent.children.push(g); groups.set(addr, g); return g;
  };
  for (const ws of state.workspaces || []) {
    const drawn = new Set();
    const wsKey = ws.name;
    groupFor(wsKey, ws.name);
    for (const n of ws.nodes || []) {
      if (!includeContext && !matches(n)) continue;
      drawn.add(n.id);
      const key = n.module ? wsKey + '|' + n.module : wsKey;
      if (n.module) groupFor(key, n.module);
      groups.get(key).children.push({ id: resourceKey(ws.name, n.id), node: n, workspace: ws.name,
        width: Math.max(n.type.length, displayName(n).length + 2) * CHAR + PAD_X * 2,
        height: NODE_H });
    }
    for (const e of ws.edges || []) {
      if (!drawn.has(e.from) || !drawn.has(e.to)) continue;
      root.edges.push({ id: resourceKey(ws.name, e.from) + '>' + resourceKey(ws.name, e.to),
        sources: [resourceKey(ws.name, e.from)], targets: [resourceKey(ws.name, e.to)] });
    }
  }
  return root;
}

function drawGraph(layout) {
  const restoreFocus = preserveFocus();
  graphLayout = layout;
  world.innerHTML = '';
  const defs = document.createElementNS(svgNS, 'defs');
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778f88"/></marker>`;
  world.appendChild(defs);
  const el = (name, attrs, parent) => {
    const x = document.createElementNS(svgNS, name);
    for (const [k, v] of Object.entries(attrs)) x.setAttribute(k, v);
    parent.appendChild(x); return x;
  };
  const pos = new Map(), origins = new Map([[layout.id, {x: 0, y: 0}]]);
  const edgeLayer = el('g', {}, world), nodeLayer = el('g', {}, world);
  (function walk(node, ox, oy) {
    for (const c of node.children || []) {
      const x = ox + c.x, y = oy + c.y;
      if (c.isModule) {
        origins.set(c.id, {x, y});
        el('rect', { class: 'module-box', x, y, width: c.width, height: c.height, rx: 8 }, nodeLayer);
        el('text', { class: 'module-label', x: x + 14, y: y + 22 }, nodeLayer).textContent = c.label;
        walk(c, x, y);
      } else {
        pos.set(c.id, { x, y, w: c.width, h: c.height });
        const n = c.node, color = GRAPH_COLORS[n.status] || '#929cab';
        const group = el('g', {class: 'graph-node', role: 'button', tabindex: '0', 'data-key': c.id,
          'aria-label': `${n.id}, ${ACTION_NAMES[n.status] || n.status}, ${c.workspace}`}, nodeLayer);
        group.addEventListener('mousedown', e => e.stopPropagation());
        group.addEventListener('click', e => { e.stopPropagation(); openDetail(c.workspace, n.id, group); });
        group.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(c.workspace, n.id, group); }
        });
        const box = el('rect', { class: 'node-box', x, y, width: c.width,
          height: c.height, rx: 6, stroke: color }, group);
        if (n.status === 'create') box.setAttribute('stroke-dasharray', '7 4');
        el('text', { class: 'node-type', x: x + PAD_X, y: y + 19, fill: color },
          group).textContent = displayName(n);
        el('text', { class: 'node-name', x: x + PAD_X, y: y + 36 },
          group).textContent = n.type;
        el('text', {class: 'node-name', x: x + PAD_X, y: y + 53}, group).textContent = ACTION_NAMES[n.status] || n.status;
      }
    }
  })(layout, 0, 0);
  for (const e of layout.edges || []) {
    const s = pos.get(e.sources[0]), t = pos.get(e.targets[0]);
    if (!s || !t) continue;
    if (e.sections?.length) {
      const origin = origins.get(e.container) || {x: 0, y: 0};
      for (const section of e.sections) {
        const points = [section.startPoint, ...(section.bendPoints || []), section.endPoint];
        el('path', {class: 'edge', 'marker-end': 'url(#arrow)', 'data-from': e.sources[0], 'data-to': e.targets[0],
          d: points.map((p, i) => `${i ? 'L' : 'M'} ${p.x + origin.x} ${p.y + origin.y}`).join(' ')}, edgeLayer);
      }
      continue;
    }
    let x1, y1, x2, y2;
    if (t.x >= s.x + s.w) { x1 = s.x + s.w; x2 = t.x; }
    else if (t.x + t.w <= s.x) { x1 = s.x; x2 = t.x + t.w; }
    else {
      x1 = s.x + s.w / 2; x2 = t.x + t.w / 2;
      const down = t.y >= s.y + s.h;
      y1 = down ? s.y + s.h : s.y; y2 = down ? t.y : t.y + t.h;
      el('path', { class: 'edge', 'marker-end': 'url(#arrow)',
        d: `M ${x1} ${y1} C ${x1} ${(y1 + y2) / 2}, ${x2} ${(y1 + y2) / 2}, ${x2} ${y2}` }, edgeLayer);
      continue;
    }
    y1 = s.y + s.h / 2; y2 = t.y + t.h / 2;
    const mx = (x1 + x2) / 2;
    el('path', { class: 'edge', 'marker-end': 'url(#arrow)',
      d: `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}` }, edgeLayer);
  }
  if (firstGraphDraw && layout.width) {
    fitGraph(); firstGraphDraw = false;
  }
  restoreFocus();
}

let tab = 'map', latest = null, paintGeneration = 0;
function setTab(t) {
  tab = t;
  for (const name of ['map', 'review', 'graph']) {
    const active = name === t;
    $('tab-' + name).classList.toggle('on', active);
    $('tab-' + name).setAttribute('aria-selected', String(active));
    $('tab-' + name).tabIndex = active ? 0 : -1;
  }
  $('map').style.display = t === 'map' ? 'block' : 'none';
  $('graph').style.display = t === 'graph' ? 'block' : 'none';
  $('review').style.display = t === 'review' ? 'flex' : 'none';

}
$('tab-map').onclick = () => setTab('map');

  $('tab-' + name).addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    const names = ['map', 'review', 'graph'];
    const next = e.key === 'Home' ? 'map' : e.key === 'End' ? 'graph'
      : names[(names.indexOf(name) + (e.key === 'ArrowLeft' ? 2 : 1)) % 3];
    setTab(next);
    $('tab-' + next).focus();
  });
}

async function paint(s) {
  const generation = ++paintGeneration;
  updateWorkspaceFilter(s);
  renderChips({...s, workspaces: (s.workspaces || []).filter(ws => !reviewWorkspace || ws.name === reviewWorkspace)});
  if (tab === 'review') renderReview(s);
  else if (tab === 'map') renderMap(scopedState(s));
  else {
    $('graph-all').hidden = !graphFocus;
    $('graph-context').textContent = graphFocus ? graphFocus.address : 'Dependent → prerequisite';
    $('graph').setAttribute('aria-busy', 'true');
    try {
      const layout = await elk.layout(toElk(relationshipState(s), !!graphFocus));
      if (generation !== paintGeneration || tab !== 'graph') return;
      drawGraph(layout);
    } catch (err) {
      if (generation === paintGeneration) $('graph-context').textContent = `Layout unavailable: ${err.message}`;
    } finally {
      if (generation === paintGeneration) $('graph').setAttribute('aria-busy', 'false');
    }
  }
}

async function render(s) {
  latest = s;
  const wss = s.workspaces || [];
  const total = wss.reduce((a, w) => a + (w.nodes || []).length, 0);
  const busy = wss.some(w => w.rebuilding);
  const failed = wss.filter(w => w.error).length;
  $('dot').className = busy ? 'busy' : 'live';
  $('meta').textContent = `${wss.length} workspace${wss.length === 1 ? '' : 's'} · ` +
    `${total} resources${failed ? ` · ${failed} failing` : ''} · ` +
    new Date(s.generatedAt).toLocaleTimeString();
  await paint(s);
}

window.addEventListener('resize', () => {
  if (latest && tab === 'map') renderMap(scopedState(latest));
  else if (tab === 'graph') fitGraph();
});
initializeReview();

const es = new EventSource('/events');
es.onmessage = e => render(JSON.parse(e.data)).catch(err => {
  $('mapbody').insertAdjacentHTML('afterbegin',
    `<div class="ws-err">render error: ${esc(err.message)}</div>`);
});
es.onerror = () => { $('dot').className = 'down'; };
</script>
</body>
</html>
