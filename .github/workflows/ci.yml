name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Vulnerability databases change without the code changing, so the scans
    # are re-run weekly rather than only on a commit.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-site.py

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^examples/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race -count=1 ./...

  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: terradune:test
          build-args: VERSION=test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: bash scripts/docker-smoke.sh terradune:test
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
      - run: docker compose config --quiet
      - name: Scan shipped image
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: terradune:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true

      # gosec: Go-specific static analysis for insecure patterns.
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec
        continue-on-error: true

      # gosec again, this time deciding the job: SARIF above is for the
      # security tab, this is the gate.
      - name: gosec (gate)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      # staticcheck: correctness and misuse the compiler does not catch.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # govulncheck: known vulnerabilities in this code's actual call paths.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # The open-source rulesets, run locally: no account and no upload. The
      # examples are Terraform fixtures rather than shipped code.
      - run: |
          semgrep scan --error --quiet --exclude=examples \
            --config p/golang --config p/javascript --config p/secrets
