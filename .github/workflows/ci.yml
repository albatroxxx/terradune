name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Vulnerability databases change without the code changing, so the scans
    # are re-run weekly rather than only on a commit.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser and accessibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: e2e/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: e2e
      - run: pnpm test --project=${{ matrix.browser }}
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  site:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-site.py

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - name: Verify Go installation
        run: |
          export GOBIN="$RUNNER_TEMP/terradune-install"
          mkdir -p "$GOBIN"
          go install .
          executable="$GOBIN/terradune"
          if [ "$RUNNER_OS" = Windows ]; then executable="$executable.exe"; fi
          "$executable" -version
          "$executable" -help
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^examples/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race -count=1 ./...

  cli:
    name: CLI (${{ matrix.cli }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cli: [terraform, tofu]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: matrix.cli == 'terraform'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        if: matrix.cli == 'tofu'
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Run real init, plan, show and graph
        env:
          CLI: ${{ matrix.cli }}
        run: |
          cli_path=$(command -v "$CLI")
          if [ "$RUNNER_OS" = Windows ]; then cli_path=$(cygpath -w "$cli_path"); fi
          TERRADUNE_TEST_CLI="$cli_path" go test -race -count=1 -run TestCLIIntegration -v ./internal/ingest

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true

      # gosec: Go-specific static analysis for insecure patterns.
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec
        continue-on-error: true

      # gosec again, this time deciding the job: SARIF above is for the
      # security tab, this is the gate.
      - name: gosec (gate)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      # staticcheck: correctness and misuse the compiler does not catch.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # govulncheck: known vulnerabilities in this code's actual call paths.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # The open-source rulesets, run locally: no account and no upload. The
      # examples are Terraform fixtures rather than shipped code.
      - run: |
          semgrep scan --error --quiet --exclude=examples \
            --config p/golang --config p/javascript --config p/secrets
