name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Vulnerability databases change without the code changing, so the scans
    # are re-run weekly rather than only on a commit.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser and accessibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          package_json_file: e2e/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: e2e
      - run: pnpm test --project=${{ matrix.browser }}
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  site:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-site.py

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^examples/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race -count=1 ./...

  docker:
    name: Docker (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: terradune:test
          build-args: VERSION=test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: bash scripts/docker-smoke.sh terradune:test
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
      - run: docker compose config --quiet
      - name: Scan shipped image
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: terradune:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

  binaries:
    name: Binary build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          install-only: true
      # A broken release config or a cross-build that does not compile should
      # fail here, not halfway through a release where the image is already
      # published and the tag already exists.
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean --skip=sign
      - run: python3 scripts/check-archives.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7

  archive-install:
    name: Archive install (${{ matrix.os }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: native-archives
          path: dist
      - run: python3 scripts/check-archives.py

  signing:
    name: Keyless signing round trip
    needs: binaries
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-archives
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify the packaged checksums
        env:
          # The certificate names the workflow that defines this job — this
          # file — not the caller. github.workflow_ref names the caller, so it
          # matched on standalone runs and broke the first time release.yml
          # called this workflow. The real release signature is produced by
          # release.yml itself and verifies against that identity; this
          # rehearsal verifies its own.
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          cosign sign-blob --yes --bundle=dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob --bundle=dist/checksums.txt.sigstore.json \
            --certificate-identity="$IDENTITY" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-proof
          path: |
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          retention-days: 7

  cli:
    name: CLI (${{ matrix.cli }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cli: [terraform, tofu]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: matrix.cli == 'terraform'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        if: matrix.cli == 'tofu'
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Run real init, plan, show and graph
        env:
          CLI: ${{ matrix.cli }}
        run: |
          cli_path=$(command -v "$CLI")
          if [ "$RUNNER_OS" = Windows ]; then cli_path=$(cygpath -w "$cli_path"); fi
          TERRADUNE_TEST_CLI="$cli_path" go test -race -count=1 -run TestCLIIntegration -v ./internal/ingest

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true

      # gosec: Go-specific static analysis for insecure patterns.
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec
        continue-on-error: true

      # gosec again, this time deciding the job: SARIF above is for the
      # security tab, this is the gate.
      - name: gosec (gate)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      # staticcheck: correctness and misuse the compiler does not catch.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # govulncheck: known vulnerabilities in this code's actual call paths.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # The open-source rulesets, run locally: no account and no upload. The
      # examples are Terraform fixtures rather than shipped code.
      - run: |
          semgrep scan --error --quiet --exclude=examples \
            --config p/golang --config p/javascript --config p/secrets
