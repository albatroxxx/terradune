name: CI

on:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Vulnerability databases change without the code changing, so the scans
    # are re-run weekly rather than only on a commit.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.select.outputs.site }}
      test: ${{ steps.select.outputs.test }}
      browser: ${{ steps.select.outputs.browser }}
      cli: ${{ steps.select.outputs.cli }}
      sast: ${{ steps.select.outputs.sast }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/python" -m pip install pre-commit==4.6.2
      - name: Fast repository checks
        env:
          # The Go matrix already enforces gofmt. Do not install Go for site/docs-only CI.
          SKIP: gofmt
        run: '"$RUNNER_TEMP/pre-commit/bin/pre-commit" run --all-files --show-diff-on-failure'
      - id: select
        run: python3 scripts/ci.py
        env:
          FORCE_FULL: ${{ inputs.force_full || false }}

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Browser and accessibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: e2e/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: e2e
      - run: pnpm test --project=${{ matrix.browser }}
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  site:
    name: Website layout and accessibility
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-site.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: e2e/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm exec playwright test --config=site.config.js
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-browser
          path: |
            e2e/site-report/
            e2e/site-results/
          retention-days: 7

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - name: Verify Go installation
        run: |
          export GOBIN="$RUNNER_TEMP/terradune-install"
          mkdir -p "$GOBIN"
          go install .
          executable="$GOBIN/terradune"
          if [ "$RUNNER_OS" = Windows ]; then executable="$executable.exe"; fi
          "$executable" -version
          "$executable" -help
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^examples/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce package coverage
        run: python3 scripts/check-coverage.py coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 7

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    name: CLI (${{ matrix.cli }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cli: [terraform, tofu]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: matrix.cli == 'terraform'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.cli == 'tofu'
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Run real init, plan, show and graph
        env:
          CLI: ${{ matrix.cli }}
        run: |
          cli_path=$(command -v "$CLI")
          if [ "$RUNNER_OS" = Windows ]; then cli_path=$(cygpath -w "$cli_path"); fi
          TERRADUNE_TEST_CLI="$cli_path" go test -race -count=1 -run TestCLIIntegration -v ./internal/ingest

  sast:
    needs: changes
    if: needs.changes.outputs.sast == 'true'
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read from go.mod so the two can never drift apart.
          go-version-file: go.mod
          check-latest: true

      # gosec: Go-specific static analysis for insecure patterns.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif
          category: gosec
        continue-on-error: true

      # staticcheck: correctness and misuse the compiler does not catch.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # govulncheck: known vulnerabilities in this code's actual call paths.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # The open-source rulesets, run locally: no account and no upload. The
      # examples are Terraform fixtures rather than shipped code.
      - run: |
          semgrep scan --error --quiet --exclude=examples \
            --config p/golang --config p/javascript --config p/secrets

  result:
    name: CI result
    if: always()
    needs: [changes, browser, site, test, cli, sast, semgrep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/ci.py gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
