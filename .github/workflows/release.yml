name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version to publish after validation
        required: true
        default: v1.0.3
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify stable release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
          test -f "docs/releases/$TAG.md"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new patch instead of overwriting it.'
            exit 1
          fi
      - name: Verify installation from the release commit
        run: |
          export GOBIN="$RUNNER_TEMP/terradune-install"
          mkdir -p "$GOBIN"
          cd "$RUNNER_TEMP"
          go install "github.com/albatroxxx/terradune@$GITHUB_SHA"
          "$GOBIN/terradune" -version
      - name: Publish stable Go release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --latest \
            --title "Terradune $TAG" --notes-file "docs/releases/$TAG.md"
      - name: Verify versioned Go installation
        run: |
          export GOBIN="$RUNNER_TEMP/terradune-released"
          mkdir -p "$GOBIN"
          cd "$RUNNER_TEMP"
          for attempt in $(seq 1 12); do
            if go install "github.com/albatroxxx/terradune@$TAG"; then
              test "$("$GOBIN/terradune" -version)" = "terradune $TAG"
              exit 0
            fi
            sleep 10
          done
          echo 'Go module propagation has not completed; inspect before retrying verification.'
          exit 1
