name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version to publish after validation
        required: true
        default: v1.0.0
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable release source
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
          test -f "docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Publish a new patch instead of overwriting it.'
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/albatroxxx/terradune
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      - name: Verify anonymous image access before tagging the release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          for attempt in $(seq 1 30); do
            if docker --config "$anonymous_config" pull "ghcr.io/albatroxxx/terradune@$DIGEST"; then
              exit 0
            fi
            echo 'Waiting for the package to be public in GitHub Packages settings.'
            sleep 10
          done
          echo 'Anonymous pull failed. Make the package public, then rerun the failed job.'
          exit 1
      - name: Publish release notes and immutable image reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cp "docs/releases/$TAG.md" "$RUNNER_TEMP/release.md"
          printf '\n## Verified Image\n\n`ghcr.io/albatroxxx/terradune@%s`\n\nIncludes Linux AMD64 and ARM64 images, SBOM, and provenance attestations.\n' "$DIGEST" >> "$RUNNER_TEMP/release.md"
          printf 'ghcr.io/albatroxxx/terradune@%s\n' "$DIGEST" > "$RUNNER_TEMP/container-digest.txt"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Terradune $TAG" --notes-file "$RUNNER_TEMP/release.md" "$RUNNER_TEMP/container-digest.txt"
