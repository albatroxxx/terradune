name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/check-site.py', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Wait for a real stable release before advertising installation
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$(cat VERSION)" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Stable release is not published yet; site deployment is deferred.'
          fi
      - run: python3 scripts/check-site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.release.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.release.outputs.ready == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
