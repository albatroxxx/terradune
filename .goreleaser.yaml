# Release engineering for the native binaries.
#
# The container image is built and published by .github/workflows/release.yml,
# which also creates the GitHub release itself. This file only adds the
# downloads beside it — which is what every OS package manager is ultimately
# built on, so it comes before Homebrew, .rpm or .deb can exist at all.
version: 2

project_name: terradune

before:
  hooks:
    - go mod download

builds:
  - id: terradune
    main: .
    binary: terradune
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Snapshots retain their build suffix rather than impersonating a stable tag.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - id: terradune
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Keyless signing over the checksum file. One signature covers every artifact
# through the checksums, and no key material has to be stored anywhere.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

release:
  # The publish job has already created the release, with its notes and the
  # verified image digest. Add the binaries to it; never replace that.
  mode: append

# Release notes are written by hand in docs/releases/ and published by the
# workflow, so a generated commit log would only compete with them.
changelog:
  disable: true
